hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath:
  - file://verl/trainer/config
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - actor_rollout_ref.model.path=Qwen/Qwen3-1.7B-Base
    - actor_rollout_ref.model.lora_adapter_path=/workspace/shopsimulator/shopagent-rl/outputs/sft/v2_paired/model/training_output/lora_adapter
    - actor_rollout_ref.model.lora_rank=32
    - actor_rollout_ref.model.lora_alpha=64
    - data.train_files=/workspace/shopsimulator/shopagent-rl/data/grpo_train.parquet
    - data.val_files=/workspace/shopsimulator/shopagent-rl/data/grpo_train.parquet
    - data.train_batch_size=1
    - data.max_prompt_length=512
    - data.max_response_length=8192
    - actor_rollout_ref.rollout.response_length=8192
    - actor_rollout_ref.actor.optim.lr=1e-5
    - actor_rollout_ref.actor.ppo_mini_batch_size=1
    - actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1
    - actor_rollout_ref.rollout.n=4
    - actor_rollout_ref.rollout.temperature=0.7
    - actor_rollout_ref.rollout.gpu_memory_utilization=0.25
    - actor_rollout_ref.rollout.max_model_len=10240
    - actor_rollout_ref.rollout.load_format=auto
    - actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=1
    - actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu=1
    - trainer.total_training_steps=1
    - trainer.save_freq=1
    - trainer.default_local_dir=/overlay/shopagent_rl_grpo_outputs/grpo/paired_c1hard_smoke
    - trainer.n_gpus_per_node=1
  job:
    name: main_ppo
    chdir: null
    override_dirname: actor_rollout_ref.actor.optim.lr=1e-5,actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1,actor_rollout_ref.actor.ppo_mini_batch_size=1,actor_rollout_ref.model.lora_adapter_path=/workspace/shopsimulator/shopagent-rl/outputs/sft/v2_paired/model/training_output/lora_adapter,actor_rollout_ref.model.lora_alpha=64,actor_rollout_ref.model.lora_rank=32,actor_rollout_ref.model.path=Qwen/Qwen3-1.7B-Base,actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu=1,actor_rollout_ref.rollout.gpu_memory_utilization=0.25,actor_rollout_ref.rollout.load_format=auto,actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=1,actor_rollout_ref.rollout.max_model_len=10240,actor_rollout_ref.rollout.n=4,actor_rollout_ref.rollout.response_length=8192,actor_rollout_ref.rollout.temperature=0.7,data.max_prompt_length=512,data.max_response_length=8192,data.train_batch_size=1,data.train_files=/workspace/shopsimulator/shopagent-rl/data/grpo_train.parquet,data.val_files=/workspace/shopsimulator/shopagent-rl/data/grpo_train.parquet,trainer.default_local_dir=/overlay/shopagent_rl_grpo_outputs/grpo/paired_c1hard_smoke,trainer.n_gpus_per_node=1,trainer.save_freq=1,trainer.total_training_steps=1
    id: ???
    num: ???
    config_name: grpo
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.5
    version_base: '1.3'
    cwd: /workspace/shopsimulator/shopagent-rl
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /workspace/shopsimulator/shopagent-rl/configs
      schema: file
      provider: main
    - path: verl/trainer/config
      schema: file
      provider: hydra.searchpath in main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /workspace/shopsimulator/shopagent-rl/outputs/2026-08-16/15-10-21
    choices:
      distillation: distillation
      algorithm@algorithm.rollout_correction: rollout_correction
      reward: reward
      model@critic.model: hf_model
      model@actor_rollout_ref.model: hf_model
      rollout@actor_rollout_ref.rollout: rollout
      data: legacy_data
      model_engine: dp
      critic: dp_critic
      critic/../engine@critic.fsdp: fsdp
      critic/../optim@critic.optim: fsdp
      ref@actor_rollout_ref.ref: dp_ref
      ref/../engine@actor_rollout_ref.ref.fsdp_config: fsdp
      actor@actor_rollout_ref.actor: dp_actor
      actor/../engine@actor_rollout_ref.actor.fsdp_config: fsdp
      actor/../optim@actor_rollout_ref.actor.optim: fsdp
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
