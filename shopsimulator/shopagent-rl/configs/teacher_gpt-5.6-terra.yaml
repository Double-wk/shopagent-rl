# ⚠️ mcgrox 有 model 别名陷阱（曾把 gpt-5.6-sol 路由到 gpt-5.5）；nova 同理有别名风险——
#    两渠道的 terra 探针分数(80%)与 sol(87%)/5.5(70%) 明显不同，说明 terra 路由为真 terra、未被别名。
#    全量采集中仍需留意分数漂移（尤其 nova 新接入，首跑留意 strict 是否仍 ~80%）。
