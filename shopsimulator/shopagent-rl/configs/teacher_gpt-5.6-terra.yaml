      api_keys:
        - sk-o0xw120l1ok00ow4kkj5xyz4ljzlwwj2o0xw120l1ok00ow4  # 用户提供 @08-15
    # —— 渠道 4：seekai.cc —— ⛔ 弃用 @08-15：模型名 gpt-5-6-terra（连字符写法），
    #    但上游持续 500 do_request_failed、延迟 12-39s，探针 0/10 完成后放弃。
    # - base_url: https://seekai.cc/v1
    #   model: gpt-5-6-terra
    #   weight: 1
    #   api_keys:
    #     - sk-1mlJlTGp6e67qvT5og3oMUZ3CssoJzqZwBpoKCFrVfixfzYS  # 用户提供 @08-15
  max_tokens: 512
  temperature: 0.0
  timeout: 120
  max_retries: 5
  max_turns: 30

collection:
  # —— ✅ 采集已完成 @2026-08-08（gpt-5.6-terra）。原计划 10000，1.8B 判够用即停，不再追量 ——
  total_trajectories: 5000       # 实采 5000 条（seed 42 全 train 随机目标 sft_collect_targets_5000.json）
  keep_after_validation: 3793    # teacher.validate 实过 strict（canonical ok/steps/legal，略严于 raw 标记 3826；75.9%，reward 均值 0.897）= 真正进 SFT 的量
  raw_file: data/trajectories_raw/gpt-5.6-terra/trajectories_raw.jsonl  # 5000 条源头（72.9MB）

  # 数据分配（与实际 json 一致；级联互斥 + seed 42，详见 DATA.md）
  sft_data: 5000                 # SFT 采集目标 → teacher.validate 实过 strict 3793 入训；data/sft_collect_targets_5000.json
  grpo_prompts: 1000             # GRPO prompts（排除 SFT+eval）；data/grpo_prompts_1000.json
  ablation_data: 500             # 消融 held-out（排除 SFT+GRPO+eval）；data/ablation_tasks_500.json

  train_task_range: [1459, 23421]  # 官方 train 区（21,962 个任务）
  num_workers: 24                # 实跑并发（8→12→24；最终 2 活 key 跑满 5000）
  quality_threshold: 1.0         # strict_success 只留满分轨迹

  # 数据格式
  output_format: jsonl          # ✅ 使用 JSONL 格式（每行一个 JSON 对象）
  save_mode: incremental        # ✅ 边生成边保存，实时写入

# GRPO 训练配置
grpo:
  # GRPO 不采集数据：student 自采样 rollout + env reward，只需 task_id（详见 DATA.md）
  prompt_tasks: 1000            # GRPO prompts（data/grpo_prompts_1000.json，与 SFT/eval 互斥）
  samples_per_prompt: 4          # 每问题采样 4 次（GRPO 组大小 G=4）
  total_samples: 4000           # 1000 × 4 = 4,000 rollout / 单遍

  # 对比学习
  comparison_method: "reference" # 用真实答案作为标准进行打分
  reference_answers: "sft_data"  # 用 SFT 数据作为真实答案

  # 奖励函数
  reward_function: segmented    # 分段 reward
  reward_weights:                # 权重分配
    r_type: 0.20
    r_att: 0.30
    r_option: 0.30
    r_price: 0.20

# 评测数据（使用官方 eval 数据，与训练零重叠）
evaluation:
  final_200: [0, 1459]          # 官方 eval 区（1,459 个，随机采样 200）→ data/final200.json
  ablation_tasks: data/ablation_tasks_500.json  # 消融 held-out（500，随机，与 SFT/GRPO/eval 互斥；
                                                #   旧的顺序 [1459,1959] 会和 SFT 重叠 109 条，已废）

# ✅ 对齐官方 ShopSimulator PROMPT_TEMPLATE_zh（web_agent_text_env.py:25-47，逐字照搬）。
# env / reward / multi_eval 评测均按此 prompt 设计。关键修正：action 格式去掉内层引号——
# env.parse_action 用 (.+)\[(.+)\] 解析，click['值'] 的 arg 会带引号 → 与可点击项不等 → 静默
# no-op（wrapper.py 曾加 strip 补丁兜底，但会污染 SFT 数据：student 学会带引号，官方评测必崩）。
system_prompt: |-
  你正在进行一次网上购物模拟，目标是从商品库中选购最符合需求的商品。请注意，商品库中存在大量同类商品，你必须通过合理操作，最终购买到最符合要求的目标商品。
  购物流程采用多轮对话形式，每一轮我会提供当前页面的观察结果，以及你可执行操作列表。你需要根据当前状态和可选操作，选择并执行最合适的一步。

  操作分为两类：
  1. 搜索操作
      格式：search[关键词]
      你可以根据当前需求，自主决定搜索关键词。
      只有在搜索功能可用时，才能使用该操作。
  2. 点击操作
      格式：click[值]
      你只能点击当前可用操作列表中的按钮或选项，值必须严格对应操作列表中的内容。

  规则说明：
  1. 在点击【购买】前，必须至少选择一个商品规格（如颜色、尺码等）。
  2. 你的目标是综合所有已知信息，通过搜索、筛选和选择，最终购买到“最符合需求的”商品，而非随意购买任意商品。
  3. 如果你给出的操作在当前环境中不可执行，则页面不会有任何变化。
  4. 提示：当你点击某一个商品规格时，页面其他信息不会发生变化，但该规格会被选中。请据此判断后续操作。

  输出格式
  在每一步，你必须按照下面格式输出：
  Thought: 简要说明你在当前状态下的思考过程和操作依据。
  Action: 用规定格式输出你选择的操作。
