  client_type: openai          # 使用 OpenAI 兼容客户端
  model: gpt-5.6-terra
  # ✅ 多端点 endpoints（client_openai.py 原生支持）：跨 (端点,key) round-robin，
  #    任一 (端点,key) 余额耗尽(401/402/403) 自动剔除、5xx/超时短期冷却后恢复。
  #    取代旧的单一 base_url + api_keys（二者仅在 endpoints 为空时作兜底，已弃用）。
  endpoints:
    # —— 渠道 1：mcgrox —— ⛔ 2026-08-15 实测全部候选返回 403
