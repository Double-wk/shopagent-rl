# ShopSim GRPO defaults. Paths, batch size, steps and output may be overridden by
# scripts/run_grpo.sh.

hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  train_files: ???          # CLI: one row per task_id
  val_files: ???            # CLI
  max_prompt_length: 512
  max_response_length: 8192
  return_raw_chat: True
  shuffle: True
  filter_overlong_prompts: True
  truncation: error
  # The 1,000-row parquet is tiny.  In the Ray/FSDP process tree, the inherited
  # veRL default of eight StatefulDataLoader workers forks large parent state
  # and was SIGKILLed at shutdown after consuming ~94 GB RAM.  Keep loading
  # in-process; rollout generation, not data loading, is the bottleneck.
  dataloader_num_workers: 0

actor_rollout_ref:
  hybrid_engine: True

  model:
    path: ???               # CLI: Qwen/Qwen3-1.7B-Base
    lora_adapter_path: ???  # CLI: SFT adapter
    lora_rank: 32           # non-zero is required to load/train the adapter
    lora_alpha: 64
    # Gradient checkpointing is inherited from veRL and already enabled.  The
    # actor still peaks during long-response updates on the shared 48G card, so
    # offload saved activations to host RAM between recomputation segments.
    # This changes neither rollouts nor optimizer/GRPO hyperparameters.
    enable_activation_offload: True
    # Fuse LM-head projection with token log-probability/entropy computation.
    # Avoid materializing the full [tokens, vocab] logits tensor for long
    # responses; this is mathematically equivalent and only changes the kernel.
    use_fused_kernels: True
    override_config:
      attn_implementation: sdpa

  actor:
    use_kl_loss: True
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    entropy_coeff: 0
    use_torch_compile: False

    # Keep the FSDP actor in BF16 end-to-end. The inherited veRL default
    # `model_dtype: fp32` first materializes the 1.7B base in FP32, wasting
    # several GiB on this single-card colocated rollout/training setup.
    fsdp_config:
      model_dtype: bf16
      dtype: bfloat16

  rollout:
    name: vllm
    mode: async
    load_format: auto
    n: 4
    response_length: 8192
    max_model_len: 10240
    # SFT assistant turns are strict Thought/Action records (P99=109 tokens).
    # 0.7 retains within-group GRPO variation while reducing malformed actions.
    temperature: 0.7
    top_p: 1.0
    tensor_model_parallel_size: 1
    # 0.20 cannot allocate even one 10,240-token KV cache alongside the
    # actor. 0.25 supplies the required KV-cache floor; BF16 actor loading
    # offsets this increase while preserving single-card headroom.
    gpu_memory_utilization: 0.25
    enforce_eager: True
    free_cache_engine: True
    enable_prefix_caching: True
    multi_turn:
      enable: True
      max_assistant_turns: 10
      tokenization_sanity_check_mode: disable

    agent:
      num_workers: 4
      default_agent_loop: shopsim_agent
      agent_loop_config_path: /workspace/shopsimulator/shopagent-rl/configs/shopsim_agent_loop.yaml

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: True
  use_kl_in_reward: False
  # Disabled for the matched Independent Certified GRPO baseline. The paired
  # method enables this while keeping data/order/sampling otherwise identical.
  paired_intervention:
    enabled: False
    # Available modes:
    # - joint_bonus: legacy conjunctive baseline (两侧都对 → +1)
    # - relational_advantage: symmetric prototype with signed utility
    # - relational_residual: repairs only the failing side
    # - explicit_relation: discrete conjunctive baseline with normalized intents
    # - preference_margin: policy-level preference optimization (flip/preserve)
    mode: joint_bonus
    weight: 1.0
    success_bonus: 0.25
    failure_penalty: 1.0
    joint_failure_penalty: 0.5
    # --- preference_margin only -------------------------------------------
    # Read by the differentiable relation loss the actor attaches when
    # mode=preference_margin. Ignored by every other mode.
    #   flip_weight      : -log sigma((M - m)/tau) on decision-changing pairs
    #   preserve_weight  : symmetric JS on decision-preserving pairs
    #   anchor_weight    : per-side -log P(expected intent). Without it a pair can
    #                      satisfy the margin by getting the *wrong* intent less
    #                      wrong on one side; the anchor removes that solution.
    #                      MEASURED at clean init (scratch/verify_gate_a_gradients.py):
    #                      anchor=7.32 vs preserve JS=0.0075, so at anchor_weight
    #                      >= 0.03 the combined gradient *opposes* JS on
    #                      decision-preserving pairs (cos -0.34 at 1.0) and the
    #                      preserve term is effectively inert; it descends JS only
    #                      at <= 0.01. Left at 1.0 deliberately: at clean init the
    #                      policy has P(COMMIT) ~ 2.6%, so both sides are wrong and
    #                      preserving a wrong distribution buys nothing -- fix the
    #                      intent first, and JS takes over as the anchor converges.
    #                      Revisit if Gate B shows invariance failing to improve.
    #                      Flip is unaffected: cos(-grad L, +grad M) stays positive
    #                      (+0.97 flip-only, +0.20 with the anchor).
    #   relation_coeff   : scale of the whole relation term against the PPO loss.
    #                      Defaults to `weight` so a single knob still works.
    #   margin_threshold : m in the flip loss; 0.0 means "any correct ordering".
    #   temperature      : tau; larger compresses the loss toward ln2.
    #   require_gradient_checkpointing: scoring the legal action set with grad
    #                      enabled measured 12.6 GiB with checkpointing and >48
    #                      GiB without, so this fails fast instead of OOM-ing
    #                      minutes into a step. Only disable on a larger device.
    flip_weight: 1.0
    preserve_weight: 1.0
    anchor_weight: 1.0
    relation_coeff: ${oc.select:algorithm.paired_intervention.weight,1.0}
    margin_threshold: 0.0
    temperature: 1.0
    require_gradient_checkpointing: True

trainer:
  total_epochs: 1
  project_name: shopsim_grpo
  experiment_name: qwen3-1.7b-grpo
  logger: ["console"]
  val_before_train: False
  test_freq: -1
  save_freq: ???                    # CLI (per run)
  # Raw FSDP checkpoints: large (full 1.7B base weights each) and only needed to
  # resume, so they live outside Git under the persistent ShopSim cache. Losing
  # them costs a rerun, not a result. What must NOT live here is the exported
  # adapter: on 2026-08-19 an instance restart wiped /overlay and destroyed the
  # horizon10-clean-v1 Independent adapter, leaving only its eval report.
  # Export to outputs/ (git-tracked) as soon as a checkpoint appears — see
  # scripts/export_lora_adapter.py. Overridable via SHOPAGENT_ARTIFACT_ROOT.
  default_local_dir: /root/.cache/huggingface/shopsim/artifacts/grpo_runs
  # No retention cap: the artifact volume has room for all 20 saves, and keeping
  # them preserves the success-vs-PRA checkpoint trajectory that Stage 4 needs.
  max_actor_ckpt_to_keep: null
  n_gpus_per_node: ???              # CLI
  nnodes: 1
