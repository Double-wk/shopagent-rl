# Formal paper SFT: ordinary successful trajectories only, trained directly
# from Qwen3-1.7B-Base. No init_adapter and no certified/counterfactual rows.
output_dir: /workspace/shopsimulator/shopagent-rl/outputs/sft/v6_horizon10_clean_from_base/model/training_output

data:
  train_file: /workspace/shopsimulator/shopagent-rl/data/sft_train_horizon10.jsonl

model:
  base_model: Qwen/Qwen3-1.7B-Base
  revision: ea980cb0a6c2ae4b936e82123acc929f1cec04c1
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  max_seq_length: 8192
  batch_size: 1
  grad_accum: 8
  epochs: 3
  lr: 1.0e-4
  warmup_ratio: 0.03
  logging_steps: 10
  save_strategy: epoch
  save_total_limit: 3
  gradient_checkpointing: true
  group_by_length: false
  seed: 42
  data_seed: 42
