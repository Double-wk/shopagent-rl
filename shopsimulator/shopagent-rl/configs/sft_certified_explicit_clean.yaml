# Clean single-seed SFT with explicit budgets on both sides of every price pair.
output_dir: /workspace/shopsimulator/shopagent-rl/outputs/sft/v5_certified_explicit_clean/model/training_output

data:
  train_file: /workspace/shopsimulator/shopagent-rl/data/sft_train_certified_explicit_clean_mix.jsonl

model:
  base_model: Qwen/Qwen3-1.7B-Base
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  max_seq_length: 8192
  batch_size: 2
  grad_accum: 4
  group_by_length: true
  epochs: 3
  lr: 1.0e-4
  warmup_ratio: 0.03
  logging_steps: 10
  save_strategy: epoch
  gradient_checkpointing: true
