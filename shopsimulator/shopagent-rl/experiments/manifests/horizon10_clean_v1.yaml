# The 2026-08-19 instance restart destroyed /overlay (ephemeral container disk).
# Everything under /workspace survived. Recorded here because it changes what
# can still be reproduced without retraining.
artifact_loss:
  date: 2026-08-19
  lost:
    - horizon10_clean_v1_independent export_step_200/lora_adapter
    - horizon10_clean_v1_independent global_step_10..200 FSDP checkpoints
    - vllm gfx1100 source build, conda env site-packages, HF hub cache
  survived:
    - outputs/sft/v6_horizon10_clean_from_base (clean SFT adapter, both arms init from it)
    - all Final-200 and heldout-v2 evaluation reports
  consequence: >-
    The Independent Final-200 strict 0.35 and heldout-v2 numbers stand as a
    single-seed record but cannot be extended. Paired GRPO does not depend on
    the lost adapter (it initializes from the clean SFT adapter), so it can run
    first. Independent must be retrained before the paper's matched comparison:
    the 3-seed Final-200 protocol, the nuisance invariance column, and the
    success-vs-PRA checkpoint trajectory all require the weights, and numbers
    from a retrained adapter must not be mixed with the 2026-08-19 run.
  policy: >-
    Adopted 2026-08-20 and enforced by tests/test_experiment_protocol.py. Split
    by reproducibility, not size. Raw FSDP checkpoints and optimizer shards stay
    on /overlay (large, ephemeral, recoverable by rerunning). Exported LoRA
    adapters, evaluation reports, metrics and this manifest live under outputs/
    and are committed. The operational requirement is timing: export each
    checkpoint to outputs/ as it lands rather than at the end of the run, since
    /overlay is wiped on instance restart. Using /overlay for checkpoints was
    never the mistake; keeping the only copy of a finished adapter there was.

historical_controls:
  v4_corrective: feasibility_and_shortcut_correction_only
  v5_explicit_clean: explicit_format_shortcut_ablation_only
